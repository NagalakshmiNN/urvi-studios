name: Tests

# Runs the full suite on every push and pull request. A red cross next to a
# commit on GitHub means something in this push broke — open the run, and the
# "playwright-report" artifact at the bottom shows exactly which test failed,
# with a screenshot and a trace of the browser at the moment it went wrong.
#
# Note: Netlify deploys straight from the push, in parallel with this — so a
# failure here does not by itself stop a deploy. To make it stop one, turn on
# branch protection for `main` (GitHub → Settings → Branches → Add rule →
# "Require status checks to pass") and work through pull requests.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Typecheck, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://postgres:devpassword@localhost:5432/urvi_test
      # The build needs *a* database URL present; the suite overrides it with
      # the throwaway test database above at run time.
      DATABASE_URL: postgres://postgres:devpassword@localhost:5432/urvi_test
      SESSION_SECRET: ci-session-secret-not-used-anywhere-real

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run the full test suite
        run: npm test

      - name: Upload the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
